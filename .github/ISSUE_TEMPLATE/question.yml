name: Share an interview question
description: Post a question you were asked so others preparing for the same company can see it.
title: "[Company] Question"
labels: ["community-question"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the question in your own words. This issue is **public** and appears on the Community tab.
        **Privacy & confidentiality:** Do not share NDA-covered material, proprietary details, internal company code, or personally identifying information (emails, phone numbers, recruiter names).
        Check the existing [question bank](https://sadiqgpasha89.github.io/InterviewGearUp/#/questions) first so you do not submit a duplicate.
  - type: checkboxes
    id: confirm-public
    attributes:
      label: Privacy and originality check
      options:
        - label: This is written in my own words and contains no confidential, NDA-covered, or personally identifying information.
          required: true
  - type: input
    id: company
    attributes:
      label: Company
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role
      options:
        - "Software engineer (core)"
        - "Frontend engineer"
        - "Backend engineer"
        - "DevOps / SRE / Cloud"
        - "Data engineer"
        - "ML / AI engineer"
        - "Data scientist"
        - "QA / SDET"
        - "Security engineer"
        - "Tech lead / Engineering manager"
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - "1 Junior (0 to 2 years)"
        - "2 Mid-level (2 to 5 years)"
        - "3 Senior (5 to 8 years)"
        - "4 Lead / Staff (8+ years)"
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - "Fintech / Banking"
        - "E-commerce / Retail"
        - "Telecom / Networking"
        - "Healthcare"
        - "SaaS / Enterprise software"
        - "Gaming / Media"
        - "AI / Data products"
        - "Cloud / Infrastructure"
        - "Consulting / IT services"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: round
    attributes:
      label: Round
      options:
        - "Phone screen"
        - "Coding"
        - "System design"
        - "Technical deep dive"
        - "Behavioral"
        - "Hiring manager"
        - "Take-home"
        - "Onsite loop"
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: Year asked
      placeholder: "2026"
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The question as it was asked, including any constraints the interviewer gave.
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: Your answer (optional)
      description: How you answered, or how you would answer now.
